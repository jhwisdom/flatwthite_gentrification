<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gentrification Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; color: #111; }
    #layout { display: flex; height: 100%; }

    /* Filter sidebar */
    #sidebar { width: 280px; flex-shrink: 0; overflow-y: auto; padding: 16px; border-right: 1px solid #ccc; background: #fff; }
    #sidebar h2 { font-size: 16px; margin: 16px 0 8px; }
    #sidebar h2:first-child { margin-top: 0; }
    #sidebar label { display: block; padding: 4px 0; font-size: 15px; }
    .hint { font-size: 13px; color: #666; }
    #filter-toggle { display: none; }

    /* Map */
    #map { flex: 1; height: 100%;
      /* Stop the phone's own long-press menu / text selection on the map */
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

    /* Pin form (bottom sheet) */
    #pin-dialog { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: #fff;
      border-top: 1px solid #999; padding: 16px; max-width: 520px; margin: 0 auto; }
    #pin-dialog[hidden] { display: none; }
    #pin-dialog h2 { font-size: 17px; margin: 0 0 12px; }
    #pin-dialog label { display: block; font-size: 14px; margin: 10px 0 4px; }
    #pin-dialog select, #pin-dialog input, #pin-dialog textarea { width: 100%; font-size: 16px; padding: 8px; }
    #pin-dialog textarea { height: 90px; resize: vertical; }
    #comment-count { font-size: 12px; color: #666; text-align: right; }
    .buttons { display: flex; gap: 8px; margin-top: 12px; }
    .buttons button { flex: 1; font-size: 16px; padding: 10px; }
    #pin-status { min-height: 1.2em; font-size: 14px; margin: 8px 0 0; }
    #pin-status.error { color: #b00020; }

    #toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1100;
      background: #111; color: #fff; padding: 8px 14px; font-size: 14px; }
    #toast[hidden] { display: none; }

    .legend { background: #fff; padding: 6px 8px; font-size: 13px; border: 1px solid #999; }
    .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; }

    /* Phones: filters become a collapsible panel above the map */
    @media (max-width: 700px) {
      #layout { flex-direction: column; }
      #filter-toggle { display: block; width: 100%; padding: 10px; font-size: 16px; border: 0; border-bottom: 1px solid #ccc; background: #f4f4f4; }
      #sidebar { width: 100%; max-height: 45vh; border-right: 0; border-bottom: 1px solid #ccc; }
      #sidebar:not(.open) { display: none; }
      #map { flex: 1; height: auto; }
    }
  </style>
</head>
<body>
  <div id="layout">
    <button id="filter-toggle" type="button" aria-expanded="false">Filters</button>
    <aside id="sidebar">
      <p class="hint">Long-press anywhere on the map to add a pin.</p>

      <h2>Indicators</h2>
      <div id="indicator-filters"></div>
      <p class="hint">No selection = show all pins.</p>

      <h2>Mietspiegel</h2>
      <div id="overlay-filters"></div>
      <p class="hint">Layers can be combined.</p>

      <p class="hint"><a href="index.html">← Back to start</a></p>
      <p class="hint" id="mock-note" hidden>Demo mode: no API_URL set in config.js, nothing is saved.</p>
    </aside>
    <div id="map"></div>
  </div>

  <form id="pin-dialog" hidden autocomplete="off">
    <h2>Add a pin</h2>
    <label for="pin-indicator">Indicator</label>
    <select id="pin-indicator" required></select>
    <input id="pin-new-indicator" type="text" placeholder="New indicator" hidden>
    <label for="pin-comment">Comment</label>
    <textarea id="pin-comment" required></textarea>
    <div id="comment-count"></div>
    <p id="pin-status" role="status"></p>
    <div class="buttons">
      <button type="button" id="pin-cancel">Cancel</button>
      <button type="submit" id="pin-save">Save</button>
    </div>
  </form>

  <div id="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    const config = window.APP_CONFIG;
    const NEW_OPTION = "__new__";
    document.getElementById("mock-note").hidden = !Api.useMock;

    // ---------- Map setup ----------
    const map = L.map("map").setView(config.MAP_CENTER, config.MAP_ZOOM);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    const pinLayer = L.layerGroup().addTo(map);

    // ---------- State ----------
    let pins = [];                  // all pins loaded from the sheet (plus local ones)
    let indicators = [];            // unique indicator names
    const selected = new Set();     // normalized indicators checked in the filter

    // ---------- Small helpers ----------
    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.hidden = false;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => (el.hidden = true), 3500);
    }

    // Builds popup content with DOM nodes so user text is never parsed as HTML.
    function popupContent(pin) {
      const box = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = pin.indicator;
      const text = document.createElement("p");
      text.style.margin = "6px 0 0";
      text.textContent = pin.comment;
      box.append(title, text);
      return box;
    }

    // ---------- Pins and filters ----------
    function renderPins() {
      pinLayer.clearLayers();
      for (const pin of pins) {
        if (selected.size > 0 && !selected.has(Api.normalize(pin.indicator))) continue;
        L.marker([pin.lat, pin.lng]).bindPopup(popupContent(pin)).addTo(pinLayer);
      }
    }

    function renderFilters() {
      const box = document.getElementById("indicator-filters");
      box.replaceChildren();
      for (const name of indicators) {
        const key = Api.normalize(name);
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = selected.has(key);
        checkbox.addEventListener("change", () => {
          checkbox.checked ? selected.add(key) : selected.delete(key);
          renderPins();
        });
        label.append(checkbox, " " + name);
        box.appendChild(label);
      }
    }

    function renderIndicatorSelect() {
      const select = document.getElementById("pin-indicator");
      const previous = select.value;
      select.replaceChildren();
      const placeholder = new Option("Choose an indicator…", "");
      placeholder.disabled = true;
      select.add(placeholder);
      for (const name of indicators) select.add(new Option(name, name));
      select.add(new Option("+ Add a new indicator", NEW_OPTION));
      select.value = [...select.options].some((o) => o.value === previous) ? previous : "";
    }

    function setIndicators(list) {
      const merged = Api.uniqueIndicators(list);
      // Only rebuild the UI when the list actually changed.
      if (merged.join("\n") === indicators.join("\n")) return;
      indicators = merged;
      renderFilters();
      renderIndicatorSelect();
    }

    async function refresh() {
      const [indicatorData, pinData] = await Promise.all([Api.getIndicators(), Api.getPins()]);
      // Keep pins that were just added locally but are not in the sheet response yet.
      const serverIds = new Set(pinData.pins.map((p) => p.id));
      const localOnly = pins.filter((p) => p.local && !serverIds.has(p.id));
      pins = pinData.pins.concat(localOnly);
      // Indicators come from the indicator sheet and from pins.
      setIndicators(indicatorData.indicators.concat(pins.map((p) => p.indicator)));
      renderPins();
    }

    // ---------- Mietspiegel overlays ----------
    // Each entry in config.OVERLAYS becomes its own checkbox, map layer and legend.
    const overlays = {}; // id -> { layer, legend }

    // Picks the colour class for a value: colors[i] where value < breaks[i].
    function colorFor(overlay, value) {
      const v = Number(value);
      if (value === null || value === undefined || value === "" || !isFinite(v)) return "#999";
      const i = overlay.breaks.findIndex((b) => v < b);
      return overlay.colors[i === -1 ? overlay.colors.length - 1 : i];
    }

    async function loadOverlay(overlay) {
      const res = await fetch(overlay.url);
      if (!res.ok) throw new Error(`${overlay.url} not found`);
      const geojson = await res.json();
      return L.geoJSON(geojson, {
        style: (feature) => ({
          color: "#333", weight: 1, fillOpacity: 0.45,
          fillColor: colorFor(overlay, (feature.properties || {})[overlay.property]),
        }),
        onEachFeature: (feature, layer) => {
          // Popup lists all properties of the area (as text, never HTML).
          const box = document.createElement("div");
          for (const [key, value] of Object.entries(feature.properties || {})) {
            const line = document.createElement("div");
            line.textContent = `${key}: ${value}`;
            box.appendChild(line);
          }
          layer.bindPopup(box);
        },
      });
    }

    function makeLegend(overlay) {
      const control = L.control({ position: "bottomright" });
      control.onAdd = () => {
        const div = L.DomUtil.create("div", "legend");
        const title = document.createElement("strong");
        title.textContent = overlay.label;
        div.appendChild(title);
        overlay.colors.forEach((color, i) => {
          const row = document.createElement("div");
          const swatch = document.createElement("i");
          swatch.style.background = color;
          row.append(swatch, overlay.legendLabels[i]);
          div.appendChild(row);
        });
        return div;
      };
      return control;
    }

    function renderOverlayToggles() {
      const box = document.getElementById("overlay-filters");
      for (const overlay of config.OVERLAYS) {
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = `overlay-${overlay.id}`;
        label.append(checkbox, " " + overlay.label);
        box.appendChild(label);

        checkbox.addEventListener("change", async () => {
          const state = overlays[overlay.id] || (overlays[overlay.id] = {});
          if (checkbox.checked) {
            try {
              state.layer = state.layer || (await loadOverlay(overlay));
              state.legend = state.legend || makeLegend(overlay);
              state.layer.addTo(map).bringToBack();
              state.legend.addTo(map);
            } catch (err) {
              checkbox.checked = false;
              toast(`Could not load ${overlay.label}: ${err.message}`);
            }
          } else {
            if (state.layer) map.removeLayer(state.layer);
            if (state.legend) state.legend.remove();
          }
        });
      }
    }
    renderOverlayToggles();

    // ---------- Long press to add a pin ----------
    // Custom timer instead of the browser's context menu, so it behaves the
    // same on iOS, Android and desktop.
    const container = map.getContainer();
    const activePointers = new Set();
    let pressTimer = null;
    let pressStart = null;

    function cancelPress() {
      clearTimeout(pressTimer);
      pressTimer = null;
    }

    container.addEventListener("contextmenu", (e) => e.preventDefault());

    container.addEventListener("pointerdown", (e) => {
      activePointers.add(e.pointerId);
      // Ignore pinch zoom and presses on markers, popups or map controls.
      if (activePointers.size > 1 || e.target.closest(".leaflet-marker-icon, .leaflet-popup, .leaflet-control")) {
        cancelPress();
        return;
      }
      if (e.pointerType === "mouse" && e.button !== 0) return;
      pressStart = { x: e.clientX, y: e.clientY };
      cancelPress();
      pressTimer = setTimeout(() => {
        pressTimer = null;
        const rect = container.getBoundingClientRect();
        const latlng = map.containerPointToLatLng(L.point(pressStart.x - rect.left, pressStart.y - rect.top));
        if (navigator.vibrate) navigator.vibrate(30);
        openPinDialog(latlng);
      }, config.LONG_PRESS_MS);
    });

    container.addEventListener("pointermove", (e) => {
      if (!pressTimer || !pressStart) return;
      if (Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 10) cancelPress();
    });

    for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
      container.addEventListener(type, (e) => {
        activePointers.delete(e.pointerId);
        cancelPress();
      });
    }
    map.on("movestart zoomstart", cancelPress);

    // ---------- Pin dialog ----------
    const dialog = document.getElementById("pin-dialog");
    const indicatorSelect = document.getElementById("pin-indicator");
    const newIndicatorInput = document.getElementById("pin-new-indicator");
    const commentInput = document.getElementById("pin-comment");
    const commentCount = document.getElementById("comment-count");
    const pinStatus = document.getElementById("pin-status");
    let draftLatLng = null;
    let draftMarker = null;

    newIndicatorInput.maxLength = config.MAX_INDICATOR_LENGTH;
    commentInput.maxLength = config.MAX_COMMENT_LENGTH;

    function updateCount() {
      commentCount.textContent = `${commentInput.value.length} / ${config.MAX_COMMENT_LENGTH}`;
    }
    commentInput.addEventListener("input", updateCount);

    indicatorSelect.addEventListener("change", () => {
      const isNew = indicatorSelect.value === NEW_OPTION;
      newIndicatorInput.hidden = !isNew;
      newIndicatorInput.required = isNew;
      if (isNew) newIndicatorInput.focus();
    });

    function openPinDialog(latlng) {
      draftLatLng = latlng;
      if (draftMarker) draftMarker.remove();
      draftMarker = L.marker(latlng, { opacity: 0.6 }).addTo(map);
      map.panTo(latlng);
      indicatorSelect.value = "";
      newIndicatorInput.value = "";
      newIndicatorInput.hidden = true;
      newIndicatorInput.required = false;
      commentInput.value = "";
      pinStatus.textContent = "";
      pinStatus.className = "";
      updateCount();
      dialog.hidden = false;
    }

    function closePinDialog() {
      dialog.hidden = true;
      if (draftMarker) draftMarker.remove();
      draftMarker = null;
      draftLatLng = null;
    }

    document.getElementById("pin-cancel").addEventListener("click", closePinDialog);

    dialog.addEventListener("submit", async (event) => {
      event.preventDefault();
      const indicator = (indicatorSelect.value === NEW_OPTION ? newIndicatorInput.value : indicatorSelect.value)
        .trim().replace(/\s+/g, " ");
      const comment = commentInput.value.trim();
      if (!indicator || !comment || !draftLatLng) return;

      const saveButton = document.getElementById("pin-save");
      saveButton.disabled = true;
      pinStatus.className = "";
      pinStatus.textContent = "Saving…";
      try {
        const lat = Number(draftLatLng.lat.toFixed(6));
        const lng = Number(draftLatLng.lng.toFixed(6));
        const result = await Api.addPin({ lat, lng, indicator, comment });
        closePinDialog();
        if (result.requireApproval) {
          toast("Thank you! Your pin will appear after review.");
        } else {
          pins.push({ id: result.item.id, lat, lng, indicator, comment, local: true });
          setIndicators(indicators.concat(indicator));
          renderPins();
          toast("Pin added.");
        }
      } catch (err) {
        pinStatus.className = "error";
        pinStatus.textContent = "Could not save: " + err.message;
      } finally {
        saveButton.disabled = false;
      }
    });

    // ---------- Mobile filter toggle ----------
    document.getElementById("filter-toggle").addEventListener("click", (e) => {
      const sidebar = document.getElementById("sidebar");
      const open = sidebar.classList.toggle("open");
      e.currentTarget.setAttribute("aria-expanded", String(open));
      map.invalidateSize();
    });

    startPolling(refresh, config.POLL_INTERVAL_MS);
  </script>
</body>
</html>
