<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gentrification Indicators</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="cloud" aria-hidden="true"></div>

  <main>
    <form id="indicator-form" autocomplete="off">
      <label for="indicator">What is a sign of gentrification to you?</label>
      <input id="indicator" name="indicator" type="text" required placeholder="e.g. rising rents">
      <button type="submit">Submit</button>
      <p id="status" role="status"></p>
      <p class="small"><a href="map.html">Go to the map →</a></p>
      <p class="small" id="mock-note" hidden>Demo mode: no API_URL set in config.js, nothing is saved.</p>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="script.js"></script>
    
</body>
</html>
