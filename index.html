<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frankfurt Gentrification Map</title>

  <!-- Include MapLibre GL JS CSS -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" />

<!-- Include MapLibre GL JS library -->
   <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>


  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="app">
    <div class="areas">
      <h1 id="areaQuestion">Wo ist Frankfurt stark gentrifiziert?</h1>
      <div id="areaMap"></div>
    </div>
    <!-- Search Bar (Optional) -->
    <div class="search-bar">
      <h1 id="question">Woran erkennst du Gentrifizierung?</h1>
      <input type="text" id="search" placeholder="Search (e.g., pilates)" />
      <button id="enterButton" onclick="handleEnterButton()">enter</button>
    </div>

    <div class="content">
      <div id="toolbox">toolbox</div>
      <div id="map"></div>
    </div>
  </div>

  <!-- Your custom script -->
  <script src="script.js"></script>
</body>

</html>
